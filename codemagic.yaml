workflows:
  profitride-debug:
    name: ProfitRide 4.0 APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build ProfitRide APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          APK="$(find "$CM_BUILD_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "APK lipsă"
            exit 1
          fi
          cp "$APK" "$CM_BUILD_DIR/ProfitRide.apk"
    artifacts:
      - ProfitRide.apk
